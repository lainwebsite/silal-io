<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">

{{SHELL_CSS}}
</style>

{{PAGE_CSS}}

<style>
/* ---- glue: the borrowed sections inside the homepage shell (client PDFs, 2026-10-30) ---- */
.c2_root { --font-d2-brand: "Readex Pro", system-ui, sans-serif; background: transparent; }
.s3_root { --font-d6: "Readex Pro", system-ui, sans-serif; background: transparent; min-height: 0; }
/* About: the story opens the page right under the header; labels carry no numbers (PDF) */
.x_about .c_story { padding-top: clamp(40px, 4vw, 64px); }
/* About: Our Journey = the homepage's journey laid out left to right (client frame 2026-10-30): photo, milestone
   counter and odometer year on the left; below, a line with one dot per milestone and the milestones side by side.
   While pinned, scrolling moves along the line; clicking a milestone jumps to it. */
.x_jour { --sh: max(100svh, 680px); position: relative; }
.x_jour[data-on="true"] { height: calc(var(--sh) + var(--len, 0px)); }
.x_jour .j_jourStep { cursor: pointer; }
/* clip, not hidden: a focused milestone must not scroll the pinned section sideways */
.x_jour .j_journey, .x_jour .j_jour { overflow: clip; }
.x_jour .j_jourFrames { order: -1; }
.x_jour .j_jourStep:focus-visible { outline: 2px solid var(--io); outline-offset: 6px; }
#jCount { color: var(--grey-ink, #6e7173); font-variant-numeric: tabular-nums; }
.x_jour .j_head { align-items: center; }
.x_jNav { display: flex; align-items: center; gap: 12px; color: var(--grey); }
.x_jYears { display: flex; flex-wrap: wrap; gap: 2px 18px; margin-right: 10px; }
.x_jYear { font: inherit; font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--grey); background: none; border: 0; border-bottom: 1px solid transparent; padding: 6px 0; cursor: pointer; transition: color .3s, border-color .3s; }
.x_jYear:hover { color: var(--charcoal); }
.x_jYear[aria-current="true"] { color: var(--io-ink); border-bottom-color: var(--io); }
.x_jArrow { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(89, 84, 83, .3); background: transparent; color: var(--charcoal); display: grid; place-items: center; cursor: pointer; transition: border-color .3s, color .3s, opacity .3s; }
.x_jArrow:hover:not(:disabled) { border-color: var(--io); color: var(--io-ink); }
.x_jArrow:disabled { opacity: .35; cursor: default; }
@media (max-width: 999px) { .x_jour .j_head { flex-wrap: wrap; gap: 12px; } .x_jYears { display: none; } }
@media (min-width: 1000px) {
  /* everything sized from the viewport height, so the pinned journey fits one screen at 720px and at 1080px alike */
  .x_jour[data-on="true"] > .j_journey { position: sticky; top: 0; height: var(--sh); padding: calc(64px + 2.5vh) 0 2.5vh; display: flex; flex-direction: column; justify-content: center; overflow: clip; }
  .x_jour .j_jour { width: 100%; min-width: 0; }
  .x_jour .j_head { padding-top: 2vh; border-top: 1px solid var(--io); margin-bottom: 2.4vh; }
  /* two columns (comment 2026-10-30, the right side felt empty): photo, milestone and year on the left; the line with
     its dots and the milestones moving left to right fill the right, top-aligned with the photo */
  .x_jour .j_jourGrid { display: grid; grid-template-columns: min(444px, 31vw) minmax(0, 1fr); column-gap: clamp(40px, 4.5vw, 88px); align-items: start; }
  .x_jour .j_jourStage { display: block; grid-column: 1; grid-row: 1; min-width: 0; }
  .x_jour .j_jourStick { position: static; height: auto; width: 100%; gap: 1.4vh; }
  .x_jour .j_jourFrames { flex: none; height: 38vh; aspect-ratio: auto; min-height: 0; }
  .x_jour .j_jourTicks, .x_jour .j_jourMobileImg { display: none; }
  .x_jour .j_jourTag { padding-block-start: 1.2vh; }
  .x_jour .j_odo { font-size: clamp(44px, min(5.4vw, 7.4vh), 96px); }
  .x_jour .j_jourSteps { grid-column: 2; grid-row: 1; padding: 0; margin: 0; overflow: clip; overflow-clip-margin: 16px; -webkit-mask-image: none; mask-image: none; }
  .x_jour #jList { position: relative; width: max-content; will-change: transform; }
  .x_jour .j_jourSteps ol { display: flex; margin: 0; padding: 0; list-style: none; }
  .x_jour .j_jourLine { inset: 0 0 auto 0; width: auto; height: 1px; top: 0; }
  .x_jour .j_jourLine > i { inset: -0.5px 0; transform: scaleX(0); transform-origin: left; }
  .x_jour .j_jourStep { width: clamp(300px, 27vw, 520px); min-height: 0; padding: 5vh 48px 0 2px; justify-content: flex-start; gap: 1.6vh; opacity: .3; }
  .x_jour .j_jourStep[data-on] { opacity: 1; }
  .x_jour .j_jourStep::before { top: 0; inset-inline-start: 0; }  /* the homepage rule already centres it (translate: 0 -50%) */
  .x_jour .j_jourTitle { font-size: clamp(24px, min(2.6vw, 4.4vh), 48px); }
  .x_jour .j_jourText { font-size: clamp(13px, 1.9vh, 17px); line-height: 1.6; max-width: 42ch; }
}
}
/* Team: white page; "Our Team" heading, then the label and two text columns (PDF) */
.x_team .c_section { background: #fff; padding-top: clamp(40px, 4vw, 64px); }
.x_team .c_teamHead { display: block; }
.x_team .c_teamHead .c_h2 { margin-bottom: clamp(16px, 1.6vw, 24px); }
.x_teamSub { max-width: 52ch; margin: 0; }
/* team grid and leadership open the profile pages */
.x_teamLink { display: flex; flex-direction: column; gap: 14px; color: inherit; }
.x_bioBtn { margin-top: 32px; align-self: flex-start; width: auto; }
/* press-release / profile template: its top padding made room for V3's floating header; this header is sticky and
   already takes its space, so only the section gap stays (comment 2026-10-30: too much white space on top) */
.s3_root .n3_head { padding-top: clamp(36px, 5.5vh, 64px); }
/* profile page (press-release template): portrait in the aside, quote in the text column */
.x_bioImg { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: var(--r, 6px); margin-bottom: 8px; }
.x_bioImg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
/* bio column: rows sit at the top instead of spreading over the aside's height (comment 2026-10-30) */
.n3_article { align-content: start; }
/* More of the team: portrait like the team page cards (4:5, comment 2026-10-30) */
.x_relTeam .n3_cardImg { aspect-ratio: 4 / 5; }
.x_relTeam .n3_cardImg img { object-position: 50% 50%; }
/* every team photo centred top to bottom (comment 2026-10-30) */
.x_team .c_teamImg img { object-position: 50% 50%; }
.n3_bioQuote { font-size: var(--t-lead, 22px); line-height: 1.35; color: var(--io-ink); margin: 1.4em 0; }
.x_teamCols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--col-gap, 48px); }
.x_teamCols .c_mini { grid-column: 1 / -1; }
.x_teamCols .c_body { margin: 0; }
@media (max-width: 760px) { .x_teamCols { grid-template-columns: minmax(0, 1fr); row-gap: 16px; } }
/* News: the archive label has no number or count (PDF) */
.x_news .n2_sec { padding-top: clamp(64px, 7vw, 112px); }
.x_news .n2_rowNum, .x_news .n2_rowEnd { display: none; }
.x_news .n2_row { padding-bottom: 16px; border-bottom: 1px solid var(--io); }
.n2_card[hidden], .n2_grid[hidden], .n2_empty[hidden], .n2_loadRow[hidden] { display: none; }
/* media band: label without its rule, "Contact us →" as a text link (PDF) */
.n3_media .s3_labelRule, .n3_media .s3_goO { display: none; }
/* label and breadcrumb on one line, breadcrumb to the right, the label's rule under both (comment 2026-10-30) */
.n3_head > .n3_wrap { display: grid; grid-template-columns: minmax(0, 1fr); }
.n3_head > .n3_wrap > * { grid-column: 1; }
.n3_head .s3_label, .n3_head .n3_crumbs { grid-row: 1; }
.n3_head .n3_crumbs { justify-self: end; align-self: start; align-items: baseline; margin: 0; padding: 0; line-height: var(--x-labelLh, 19px); position: relative; z-index: 1; }
/* phones: a long breadcrumb (news, or a long name like Dr. Shamal Mohammed) would run into its label, so it goes back under it */
@media (max-width: 560px) {
  .n3_head .s3_label, .n3_head .n3_crumbs { grid-row: auto; }
  .n3_head .n3_crumbs { justify-self: start; margin-top: 12px; }
}
.n3_media .s3_go { color: var(--io-ink); }
.n3_media .s3_goText::after { content: "\2192"; margin-left: 10px; }
</style>
</head>
<body>
<script>document.documentElement.classList.add("rv");setTimeout(function(){document.documentElement.classList.remove("rv")},4000)</script>

<div class="s_root" data-wide data-blue="false">
{{HEADER}}
<main>
{{BODY}}
</main>
{{FOOTER}}
</div>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script>
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var G = !!(window.gsap && window.ScrollTrigger && window.SplitText) && !reduce;
  $$('a[href="#"]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); }); });
  if (G) gsap.registerPlugin(ScrollTrigger, SplitText);

  /* ---------- smooth scroll (homepage settings), on the GSAP ticker so ScrollTrigger and Lenis share one clock ---------- */
  var lenis = null;
  if (!reduce && window.Lenis) {
    lenis = new Lenis({ duration: 1.15, easing: function (t) { return 1 - Math.pow(1 - t, 4); }, touchMultiplier: 1.4 }); window.__lenis = lenis;
    if (G) { lenis.on('scroll', ScrollTrigger.update); gsap.ticker.add(function (t) { lenis.raf(t * 1000); }); gsap.ticker.lagSmoothing(0); }
    else (function raf(t) { lenis.raf(t); requestAnimationFrame(raf); })(performance.now());
  }

  /* ---------- header, menu, newsletter (homepage behaviour; these pages have no photo hero, so no overlay) ---------- */
  var hdr = $('#hdr'), open = false, mn = $('#mobileNav');
  function hs() { hdr.dataset.scrolled = scrollY > 40; hdr.dataset.overlay = false; }
  addEventListener('scroll', hs, { passive: true }); hs();
  function setOpen(v) { open = v; if (lenis) { v ? lenis.stop() : lenis.start(); } mn.dataset.open = v; mn.setAttribute('aria-hidden', !v); $('#menuOpen').setAttribute('aria-expanded', v); }
  $('#menuOpen').addEventListener('click', function () { setOpen(true); });
  $('#menuClose').addEventListener('click', function () { setOpen(false); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) setOpen(false); });
  var nl = $('#nl'); if (nl) nl.addEventListener('submit', function (e) { e.preventDefault(); var i = $('#nlEmail'); if (i && i.value) { i.value = ''; i.placeholder = 'Subscribed. Thank you.'; } });

  /* ---------- the news archive (V2 Archive.tsx, same rules): category, year, words, six at a time ---------- */
  var arc = $('[data-archive]');
  if (arc) {
    var cards = $$('.n2_card', arc), chips = $$('.n2_chip', arc), sel = $('select', arc), q = $('input[type="search"]', arc);
    var count = $('.n2_count', arc), more = $('.n2_loadRow', arc), empty = $('.n2_empty', arc), grid = $('.n2_grid', arc), PAGE = 6, shown = PAGE, cat = 'All';
    function render(anim) {
      var words = q.value.trim().toLowerCase(), yr = sel.value, list = cards.filter(function (c) {
        return (cat === 'All' || c.dataset.cat === cat) && (yr === 'All years' || c.dataset.year === yr) && (!words || c.dataset.text.indexOf(words) > -1);
      });
      cards.forEach(function (c) { c.hidden = true; });
      list.slice(0, shown).forEach(function (c, i) { c.hidden = false; c.querySelector('.n2_meta span').textContent = String(i + 1).padStart(2, '0'); });
      count.textContent = 'Showing ' + Math.min(shown, list.length) + ' of ' + list.length + ' ' + (list.length === 1 ? 'release' : 'releases');
      more.hidden = shown >= list.length; empty.hidden = !!list.length; grid.hidden = !list.length;
      if (anim && G) { gsap.fromTo(list.slice(0, shown), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', stagger: 0.05, overwrite: true }); ScrollTrigger.refresh(); }
    }
    chips.forEach(function (b) { b.addEventListener('click', function () { cat = b.dataset.cat; chips.forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); shown = PAGE; render(true); }); });
    sel.addEventListener('change', function () { shown = PAGE; render(true); });
    q.addEventListener('input', function () { shown = PAGE; render(true); });
    $('.n2_load', arc).addEventListener('click', function () { shown += PAGE; render(true); });
    $('.n2_reset', arc).addEventListener('click', function () { cat = 'All'; sel.value = 'All years'; q.value = ''; chips.forEach(function (x) { x.setAttribute('aria-pressed', x.dataset.cat === 'All'); }); shown = PAGE; render(true); });
    render(false);
  }

  /* ---------- About · Our Journey (homepage markup, horizontal): pinned on wide screens, the milestones move left to
     right with the scroll; every milestone (and its dot) is a button that jumps to it ---------- */
  var jw = $('#xJour');
  if (jw) {
    var jl = $('#jList', jw), steps = $$('.j_jourStep', jw), frames = $$('.j_jourFrame', jw), fill = $('#jLine', jw);
    var odoT = $('#odoT', jw), odoO = $('#odoO', jw), jTag = $('#jTag', jw), jCount = $('#jCount', jw), n = steps.length;
    var jYears = $$('.x_jYear', jw), jArrows = $$('.x_jArrow', jw);
    var jOn = false, jDist = 0, jLen = 0, jCur = -1, pad = function (v) { return (v < 10 ? '0' : '') + v; };
    function jSet(c) {
      if (c === jCur) return; jCur = c;
      steps.forEach(function (s, i) { if (i === c) s.setAttribute('data-on', ''); else s.removeAttribute('data-on'); s.setAttribute('aria-current', i === c); });
      frames.forEach(function (f, i) { if (i === c) f.setAttribute('data-on', ''); else f.removeAttribute('data-on'); if (i < c) f.setAttribute('data-past', ''); else f.removeAttribute('data-past'); });
      var y = steps[c].dataset.year || '';
      if (odoT && y.length === 4) { odoT.style.transform = 'translateY(' + (-+y[2]) + 'em)'; odoO.style.transform = 'translateY(' + (-+y[3]) + 'em)'; }
      if (jTag) jTag.textContent = steps[c].dataset.tag || 'Milestone';
      if (jCount) jCount.textContent = pad(c + 1) + ' / ' + pad(n);
      jYears.forEach(function (b, i) { b.setAttribute('aria-current', i === c); });
      if (jArrows.length) { jArrows[0].disabled = c === 0; jArrows[1].disabled = c === n - 1; }
    }
    function jSetup() {
      jOn = !reduce && innerWidth >= 1000 && innerHeight >= 600;
      jw.dataset.on = jOn; jl.style.transform = ''; if (fill) fill.style.transform = '';
      jDist = jOn ? Math.max(0, steps[n - 1].offsetLeft - steps[0].offsetLeft) : 0;
      jLen = Math.round(jDist * 1.1); jw.style.setProperty('--len', jLen + 'px');
      jCur = -1; jUpd();
    }
    function jUpd() {
      var c = 0;
      if (jOn && jLen) {
        var p = Math.max(0, Math.min(1, -jw.getBoundingClientRect().top / jLen));
        jl.style.transform = 'translate3d(' + (-p * jDist).toFixed(1) + 'px,0,0)';
        if (fill) fill.style.transform = 'scaleX(' + p + ')';
        c = Math.round(p * (n - 1));
      } else {
        steps.forEach(function (s, i) { if (s.getBoundingClientRect().top < innerHeight * 0.55) c = i; });
        if (fill) fill.style.transform = 'scaleY(' + (n > 1 ? c / (n - 1) : 0) + ')';
      }
      jSet(c);
    }
    function jGo(i) {
      i = Math.max(0, Math.min(n - 1, i));
      var y = jOn ? jw.getBoundingClientRect().top + scrollY + (n > 1 ? i / (n - 1) : 0) * jLen + 2 : steps[i].getBoundingClientRect().top + scrollY - 140;
      if (lenis) lenis.scrollTo(y, { duration: 1.2 }); else scrollTo({ top: y, behavior: reduce ? 'auto' : 'smooth' });
    }
    steps.forEach(function (s, i) {
      s.setAttribute('aria-label', 'Go to ' + s.querySelector('.j_jourWhen').textContent + ': ' + s.querySelector('.j_jourTitle').textContent);
      s.addEventListener('click', function () { jGo(i); });
      s.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jGo(i); } if (e.key === 'ArrowRight') jGo(i + 1); if (e.key === 'ArrowLeft') jGo(i - 1); });
    });
    jYears.forEach(function (b, i) { b.addEventListener('click', function () { jGo(i); }); });
    jArrows.forEach(function (b) { b.addEventListener('click', function () { jGo(jCur + +b.dataset.dir); }); });
    addEventListener('scroll', jUpd, { passive: true }); addEventListener('resize', jSetup);
    jSetup(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(jSetup);
  }

  if (!G) return;
  /* ---------- motion (homepage language): line reveals, photo masks + drift, staggers, drawn rules ---------- */
  function roomy(masks) { (masks || []).forEach(function (m) { m.style.padding = '.08em 0 .16em'; m.style.margin = '-.08em 0 -.16em'; }); }
  function init() {
    var k = 0;
    $$('[data-reveal]').forEach(function (el) {
      var lines = [], played = false;
      SplitText.create(el, { type: 'lines', mask: 'lines', autoSplit: true, aria: 'none', onSplit: function (self) { roomy(self.masks); lines = self.lines; gsap.set(lines, { yPercent: played ? 0 : 135 }); el.style.visibility = 'visible'; } });
      el.setAttribute('data-rv', '');
      var play = function (d) { if (played) return; played = true; gsap.to(lines, { yPercent: 0, duration: 1.1, stagger: 0.1, delay: d || 0, ease: 'power3.out' }); };
      if (el.getBoundingClientRect().top < innerHeight * 0.92) play(0.15 + (k++) * 0.08);
      else ScrollTrigger.create({ trigger: el, start: 'top 90%', once: true, onEnter: function () { play(0); } });
    });
    $$('[data-img]').forEach(function (box) {
      gsap.fromTo(box, { clipPath: 'inset(100% 0% 0% 0%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.4, ease: 'expo.out', scrollTrigger: { trigger: box, start: 'top 88%', once: true } });
    });
    $$('[data-parallax]').forEach(function (el) {
      var amt = +(el.dataset.parallax || 8);
      gsap.fromTo(el, { yPercent: -amt }, { yPercent: amt, ease: 'none', scrollTrigger: { trigger: el.parentElement, start: 'top bottom', end: 'bottom top', scrub: true } });
    });
    $$('[data-stagger]').forEach(function (list) {
      gsap.from(list.children, { yPercent: 18, clipPath: 'inset(0 0 100% 0)', duration: 1.2, stagger: 0.12, ease: 'expo.out', scrollTrigger: { trigger: list, start: 'top 85%', once: true } });
    });
    // About-D: the IO-blue hairline under each section label draws in; the story's sticky column shows reading progress
    $$('.c_headRow').forEach(function (el) { gsap.fromTo(el, { '--rule': 0 }, { '--rule': 1, duration: 1.6, ease: 'expo.inOut', scrollTrigger: { trigger: el, start: 'top 88%' } }); });
    var story = $('.c_story');
    if (story) gsap.fromTo($('.c_storyBar'), { scaleY: 0 }, { scaleY: 1, ease: 'none', scrollTrigger: { trigger: story, start: 'top 30%', end: 'bottom 70%', scrub: true } });
  }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { setTimeout(init, 60); });
})();
</script>
