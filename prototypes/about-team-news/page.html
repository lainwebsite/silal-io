<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=swap">
<style>
{{SHELL_CSS}}
</style>
<style>
/* sections taken from V2 (archive) and V3 (media band, press release): their CSS-module rules, renamed by capture.py */
{{PAGE_CSS}}
</style>
<style>
/* ---- glue: the borrowed sections inside the homepage shell (client PDFs, 2026-10-30) ---- */
.c2_root { --font-d2-brand: "Readex Pro", system-ui, sans-serif; background: transparent; }
.s3_root { --font-d6: "Readex Pro", system-ui, sans-serif; background: transparent; min-height: 0; }
/* About: the story opens the page right under the header; labels carry no numbers (PDF) */
.x_about .c_story { padding-top: clamp(40px, 4vw, 64px); }
/* About: Our Journey = the homepage's journey laid out left to right (client frame 2026-10-30): photo, milestone
   counter and odometer year on the left; below, a line with one dot per milestone and the milestones side by side.
   While pinned, scrolling moves along the line; clicking a milestone jumps to it. */
.x_jour { --sh: max(100svh, 680px); position: relative; }
.x_jour[data-on="true"] { height: calc(var(--sh) + var(--len, 0px)); }
.x_jour .j_jourStep { cursor: pointer; }
/* clip, not hidden: a focused milestone must not scroll the pinned section sideways */
.x_jour .j_journey, .x_jour .j_jour { overflow: clip; }
.x_jour .j_jourFrames { order: -1; }
.x_jour .j_jourStep:focus-visible { outline: 2px solid var(--io); outline-offset: 6px; }
#jCount { color: var(--grey-ink, #6e7173); font-variant-numeric: tabular-nums; }
.x_jour .j_head { align-items: center; }
.x_jNav { display: flex; align-items: center; gap: 12px; color: var(--grey); }
.x_jYears { display: flex; flex-wrap: wrap; gap: 2px 18px; margin-right: 10px; }
.x_jYear { font: inherit; font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--grey); background: none; border: 0; border-bottom: 1px solid transparent; padding: 6px 0; cursor: pointer; transition: color .3s, border-color .3s; }
.x_jYear:hover { color: var(--charcoal); }
.x_jYear[aria-current="true"] { color: var(--io-ink); border-bottom-color: var(--io); }
.x_jArrow { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(89, 84, 83, .3); background: transparent; color: var(--charcoal); display: grid; place-items: center; cursor: pointer; transition: border-color .3s, color .3s, opacity .3s; }
.x_jArrow:hover:not(:disabled) { border-color: var(--io); color: var(--io-ink); }
.x_jArrow:disabled { opacity: .35; cursor: default; }
@media (max-width: 999px) { .x_jour .j_head { flex-wrap: wrap; gap: 12px; } .x_jYears { display: none; } }
@media (min-width: 1000px) {
  /* everything sized from the viewport height, so the pinned journey fits one screen at 720px and at 1080px alike */
  .x_jour[data-on="true"] > .j_journey { position: sticky; top: 0; height: var(--sh); padding: calc(64px + 2.5vh) 0 2.5vh; display: flex; flex-direction: column; justify-content: center; overflow: clip; }
  .x_jour .j_jour { width: 100%; min-width: 0; }
  .x_jour .j_head { padding-top: 2vh; border-top: 1px solid var(--io); margin-bottom: 2.4vh; }
  /* two columns (comment 2026-10-30, the right side felt empty): photo, milestone and year on the left; the line with
     its dots and the milestones moving left to right fill the right, top-aligned with the photo */
  .x_jour .j_jourGrid { display: grid; grid-template-columns: min(444px, 31vw) minmax(0, 1fr); column-gap: clamp(40px, 4.5vw, 88px); align-items: start; }
  .x_jour .j_jourStage { display: block; grid-column: 1; grid-row: 1; min-width: 0; }
  .x_jour .j_jourStick { position: static; height: auto; width: 100%; gap: 1.4vh; }
  .x_jour .j_jourFrames { flex: none; height: 38vh; aspect-ratio: auto; min-height: 0; }
  .x_jour .j_jourTicks, .x_jour .j_jourMobileImg { display: none; }
  .x_jour .j_jourTag { padding-block-start: 1.2vh; }
  .x_jour .j_odo { font-size: clamp(44px, min(5.4vw, 7.4vh), 96px); }
  .x_jour .j_jourSteps { grid-column: 2; grid-row: 1; padding: 0; margin: 0; overflow: clip; overflow-clip-margin: 16px; -webkit-mask-image: none; mask-image: none; }
  .x_jour #jList { position: relative; width: max-content; will-change: transform; }
  .x_jour .j_jourSteps ol { display: flex; margin: 0; padding: 0; list-style: none; }
  .x_jour .j_jourLine { inset: 0 0 auto 0; width: auto; height: 1px; top: 0; }
  .x_jour .j_jourLine > i { inset: -0.5px 0; transform: scaleX(0); transform-origin: left; }
  .x_jour .j_jourStep { width: clamp(300px, 27vw, 520px); min-height: 0; padding: 5vh 48px 0 2px; justify-content: flex-start; gap: 1.6vh; opacity: .3; }
  .x_jour .j_jourStep[data-on] { opacity: 1; }
  .x_jour .j_jourStep::before { top: 0; inset-inline-start: 0; }  /* the homepage rule already centres it (translate: 0 -50%) */
  .x_jour .j_jourTitle { font-size: clamp(24px, min(2.6vw, 4.4vh), 48px); }
  .x_jour .j_jourText { font-size: clamp(13px, 1.9vh, 17px); line-height: 1.6; max-width: 42ch; }
}
}
/* Team: white page; "Our Team" heading, then the label and two text columns (PDF) */
.x_team .c_section { background: #fff; padding-top: clamp(40px, 4vw, 64px); }
.x_team .c_teamHead { display: block; }
.x_team .c_teamHead .c_h2 { margin-bottom: clamp(16px, 1.6vw, 24px); }
.x_teamSub { max-width: 52ch; margin: 0; }
/* team grid and leadership open the profile pages */
.x_teamLink { display: flex; flex-direction: column; gap: 14px; color: inherit; }
.x_bioBtn { margin-top: 32px; align-self: flex-start; width: auto; }
/* press-release / profile template: its top padding made room for V3's floating header; this header is sticky and
   already takes its space, so only the section gap stays (comment 2026-10-30: too much white space on top) */
.s3_root .n3_head { padding-top: clamp(36px, 5.5vh, 64px); }
/* profile page (press-release template): portrait in the aside, quote in the text column */
.x_bioImg { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: var(--r, 6px); margin-bottom: 8px; }
.x_bioImg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
/* bio column: rows sit at the top instead of spreading over the aside's height (comment 2026-10-30) */
.n3_article { align-content: start; }
/* More of the team: portrait like the team page cards (4:5, comment 2026-10-30) */
.x_relTeam .n3_cardImg { aspect-ratio: 4 / 5; }
.x_relTeam .n3_cardImg img { object-position: 50% 50%; }
/* every team photo centred top to bottom (comment 2026-10-30) */
.x_team .c_teamImg img { object-position: 50% 50%; }
.n3_bioQuote { font-size: var(--t-lead, 22px); line-height: 1.35; color: var(--io-ink); margin: 1.4em 0; }
.x_teamCols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--col-gap, 48px); }
.x_teamCols .c_mini { grid-column: 1 / -1; }
.x_teamCols .c_body { margin: 0; }
@media (max-width: 760px) { .x_teamCols { grid-template-columns: minmax(0, 1fr); row-gap: 16px; } }
/* News: the archive label has no number or count (PDF) */
.x_news .n2_sec { padding-top: clamp(64px, 7vw, 112px); }
.x_news .n2_rowNum, .x_news .n2_rowEnd { display: none; }
.x_news .n2_row { padding-bottom: 16px; border-bottom: 1px solid var(--io); }
.n2_card[hidden], .n2_grid[hidden], .n2_empty[hidden], .n2_loadRow[hidden] { display: none; }
/* media band: label without its rule, "Contact us →" as a text link (PDF) */
.n3_media .s3_labelRule, .n3_media .s3_goO { display: none; }
/* label and breadcrumb on one line, breadcrumb to the right, the label's rule under both (comment 2026-10-30) */
.n3_head > .n3_wrap { display: grid; grid-template-columns: minmax(0, 1fr); }
.n3_head > .n3_wrap > * { grid-column: 1; }
.n3_head .s3_label, .n3_head .n3_crumbs { grid-row: 1; }
.n3_head .n3_crumbs { justify-self: end; align-self: start; align-items: baseline; margin: 0; padding: 0; line-height: var(--x-labelLh, 19px); position: relative; z-index: 1; }
/* phones: a long breadcrumb (news, or a long name like Dr. Shamal Mohammed) would run into its label, so it goes back under it */
@media (max-width: 560px) {
  .n3_head .s3_label, .n3_head .n3_crumbs { grid-row: auto; }
  .n3_head .n3_crumbs { justify-self: start; margin-top: 12px; }
}
.n3_media .s3_go { color: var(--io-ink); }
.n3_media .s3_goText::after { content: "\2192"; margin-left: 10px; }
/* ---- revision 6 November ---- */
/* About: vision + mission side by side over the photo */
.x_vm { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(32px, 5vw, 96px); }
.x_vm .c_eyebrow { margin-bottom: 18px; display: inline-flex; }
.x_vmText { font-size: clamp(1.25rem, 2.1vw, 2rem) !important; line-height: 1.25 !important; }
@media (max-width: 760px) { .x_vm { grid-template-columns: 1fr; gap: 36px; } }
/* About + Ecosystem: teaser / CTA band */
.x_ecoTeaser { padding-block: clamp(64px, 7vw, 120px); border-top: 1px solid var(--line); }
.x_ecoTeaserIn { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px 64px; flex-wrap: wrap; }
.x_ecoTeaserIn > div { max-width: 640px; }
.x_ecoTeaserIn .c_eyebrow { display: inline-flex; margin-bottom: 16px; }
.x_ecoTeaserTitle { font-size: clamp(1.75rem, 3vw, 2.75rem); font-weight: 300; line-height: 1.12; letter-spacing: -.02em; color: var(--charcoal); margin: 0 0 14px; }
.x_ecoTeaser .x_bioBtn { margin-top: 0; flex: none; }
/* Team: vertical leads and teams */
.x_secHead { grid-column: 1 / -1; display: grid; gap: 14px; margin: clamp(88px, 9vw, 150px) 0 clamp(32px, 3.5vw, 52px); max-width: 760px; }
.x_secHead .c_eyebrow { display: inline-flex; }
.x_leads, .x_teamsWrap { grid-column: 1 / -1; }
.x_teamRole { font-size: .8125rem; color: var(--grey-ink, #6e7173); margin-top: -6px; }
.x_teamBlocks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px var(--col-gap); }
.x_teamBlock { border-top: 1px solid var(--line); padding-top: 18px; }
.x_teamBlockTitle { font-size: 1.375rem; font-weight: 300; margin: 0 0 8px; color: var(--charcoal); }
.x_teamBlockLead { font-size: .875rem; color: var(--grey-ink, #6e7173); margin: 0; }
.x_teamBlockLead a { color: var(--io-ink); }
.x_teamEmpty { margin: 18px 0 0; padding: 18px; border: 1px dashed var(--line); border-radius: 6px; font-size: .8125rem; color: var(--grey-ink, #6e7173); }
.x_teamOpen { margin-top: clamp(48px, 5vw, 80px); }
.x_teamOpen .x_teamBlockHead { margin-bottom: 28px; }
@media (max-width: 900px) { .x_teamBlocks { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .x_teamBlocks { grid-template-columns: 1fr; } }
/* Ecosystem page */
.x_ecoHero { padding-top: calc(64px + clamp(40px, 6vh, 80px)); }
.x_crumbs { display: flex; gap: 8px; font-size: 13px; color: var(--grey-ink, #6e7173); margin-bottom: 28px; }
.x_crumbs a { color: inherit; } .x_crumbs [aria-current] { color: var(--charcoal); }
.x_ecoTitle { font-size: clamp(2.25rem, 4.6vw, 4.25rem); font-weight: 300; line-height: 1.05; letter-spacing: -.03em; color: var(--charcoal); max-width: 15em; margin: 18px 0 22px; }
.x_ecoLead { max-width: 40em; margin-bottom: clamp(48px, 6vw, 96px); }
.x_ecoDiagram { max-width: 1100px; margin-inline: auto; }
.x_ecoDiagram .s_ecoCore img { display: block; }
.x_ecoPartners { background: var(--light, #f4f4f2); padding-block: clamp(32px, 4vw, 64px) clamp(80px, 8vw, 140px); }
.x_ecoPartners .x_secHead { margin-top: clamp(48px, 5vw, 80px); }
.x_ecoTabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
.x_ecoTabs button { font: inherit; font-size: .875rem; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--charcoal); cursor: pointer; transition: background .25s, color .25s, border-color .25s; }
.x_ecoTabs button span { opacity: .55; margin-left: 4px; font-variant-numeric: tabular-nums; }
.x_ecoTabs button[aria-pressed="true"] { background: var(--io-ink); border-color: var(--io-ink); color: #fff; }
.x_ecoTabs button:focus-visible { outline: 2px solid var(--io); outline-offset: 2px; }
.x_ecoGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.x_ecoCard { background: #fff; border-radius: 8px; padding: 22px 22px 26px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 0 rgba(0, 0, 0, .04); }
.x_ecoCard[hidden] { display: none; }
.x_ecoLogo { height: 72px; display: grid; place-items: center start; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
.x_ecoLogo span { font-size: 1.25rem; font-weight: 600; letter-spacing: .06em; color: var(--io-ink); }
.x_ecoCat { margin: 0; font-size: .6875rem; letter-spacing: .1em; text-transform: uppercase; color: var(--io); }
.x_ecoName { margin: 0; font-size: 1.0625rem; font-weight: 400; line-height: 1.3; color: var(--charcoal); }
.x_ecoLine { margin: 0; font-size: .8125rem; line-height: 1.55; color: var(--grey-ink, #6e7173); }
.x_ecoNote { margin-top: 28px; font-size: .75rem; color: var(--grey-ink, #6e7173); max-width: 60em; }
@media (max-width: 1100px) { .x_ecoGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .x_ecoGrid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .x_ecoGrid { grid-template-columns: 1fr; } }
/* revision 9 November: profile = short description, long description, credentials */
.x_bioShort { font-size: var(--t-lead, 22px); line-height: 1.35; font-weight: 300; color: var(--io-ink); margin: 0 0 1.2em; }
.x_bioLong p { margin: 0 0 1em; }
.x_bioTbc { color: #8a9399; font-style: italic; }
.x_creds { margin-top: 2.4em; border-top: 1px solid var(--io); }
.x_credRow { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 16px; padding: 18px 0; border-bottom: 1px solid rgba(0,0,0,.1); }
.x_credH { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--io-ink); margin: 2px 0 0; }
.x_credList { list-style: none; margin: 0; padding: 0; }
.x_credList li { margin: 0 0 .4em; }
@media (max-width: 560px) { .x_credRow { grid-template-columns: 1fr; gap: 6px; } }
/* ==== revision 9 November · Team (owner: "too safe, too newspaper, too static") ====
   T1 living portrait mosaic · T2 Dr. Shamal, quote lit by the scroll · T3 org helix (pinned, iO-blue chapter) ·
   T4 the team by vertical (tabs + FLIP), lifting over T3 like the homepage curtain */
.tm_page { --sh: max(100svh, 640px); --deep: #1a6f96; --sky: #8fd1ec; background: #fff; }
.tm_blue { color: var(--io); }
.tm_lightBlue { color: var(--sky); }
.tm_page .x_crumbs { margin: 0; }
/* the iO-blue monogram (Shameer: no photo yet) — ring of the iO "O" and his initial */
.tm_mono { position: absolute; inset: 0; display: grid; place-items: center; background: var(--io); color: #fff; container-type: size; overflow: hidden; }
.tm_mono svg { position: absolute; width: 78%; left: 11%; top: 50%; translate: 0 -50%; overflow: visible; }
.tm_mono circle { fill: none; stroke: rgba(255, 255, 255, .55); stroke-width: 1; vector-effect: non-scaling-stroke; }
.tm_mono b { font-weight: 300; font-size: 44cqw; line-height: 1; letter-spacing: -.04em; translate: 0 -.04em; }
.tm_mono small { position: absolute; bottom: 7%; left: 0; right: 0; text-align: center; font-size: max(8px, 4.6cqw); letter-spacing: .16em; text-transform: uppercase; opacity: .82; }

/* ---- T1 hero: headline left, five columns of portraits drifting at different speeds on the right ---- */
.tm_hero { position: relative; display: grid; grid-template-columns: minmax(0, 5.2fr) minmax(0, 6.8fr); grid-template-rows: minmax(0, 1fr); height: calc(100svh - var(--hdr)); min-height: 600px; max-height: 1180px; overflow: clip; background: #fff; }
.tm_heroText { position: relative; z-index: 2; align-self: stretch; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
  padding: 0 clamp(24px, 3.4vw, 64px) clamp(44px, 9vh, 120px) max(var(--gutter), calc((100vw - 1920px) / 2)); }
.tm_hero .x_crumbs { position: absolute; top: clamp(22px, 4vh, 44px); left: max(var(--gutter), calc((100vw - 1920px) / 2)); }
.tm_h1 { font-size: clamp(2.75rem, min(5.9vw, 10.4vh), 6.5rem); font-weight: 300; line-height: 1.02; letter-spacing: -.045em; color: var(--charcoal); margin: clamp(18px, 2.4vh, 28px) 0 clamp(20px, 3vh, 32px); }
.tm_heroLead { font-size: var(--fs-lead); font-weight: 300; line-height: 1.55; color: var(--charcoal); max-width: 27em; }
.tm_down { margin-top: clamp(28px, 4.6vh, 52px); display: inline-flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--io-ink); }
.tm_down svg { transition: transform .5s var(--ease); }
.tm_down:hover svg { transform: translateY(3px); }
.tm_mosaic { position: relative; display: flex; gap: clamp(8px, .8vw, 14px); height: 100%; overflow: clip;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 9%, #000 91%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 9%, #000 91%, transparent 100%); }
.tm_col { position: relative; flex: 1 1 0; min-width: 0; }
.tm_colIn { display: flex; flex-direction: column; gap: clamp(8px, .8vw, 14px); will-change: transform; }
.tm_tile { position: relative; display: block; flex: none; aspect-ratio: 2 / 3; overflow: hidden; background: #e9ecee; }
.tm_tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(var(--g, 0)); transition: transform 1.2s var(--ease); }
.tm_tile:hover img, .tm_tile:focus-visible img { filter: none; transform: scale(1.045); }
.tm_cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 2px; padding: 44px 12px 12px; color: #fff;
  background: linear-gradient(180deg, transparent, rgba(16, 28, 34, .66)); transform: translateY(101%); transition: transform .55s var(--ease); }
.tm_cap b { font-size: .875rem; font-weight: 500; line-height: 1.25; }
.tm_cap i { font-style: normal; font-size: .71875rem; line-height: 1.3; opacity: .86; }
.tm_tile:hover .tm_cap, .tm_tile:focus-visible .tm_cap, .tm_tile[data-lit] .tm_cap { transform: none; }
.tm_tileMono .tm_cap { background: linear-gradient(180deg, transparent, rgba(16, 60, 86, .55)); }

/* ---- T2 leadership ---- */
.tm_leader { background: var(--light); padding: clamp(96px, 12vw, 190px) 0; }
.tm_leaderIn { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--col-gap); align-items: center; }
.tm_leaderImg { grid-column: 1 / span 5; display: block; }
.tm_leaderImg .c_photo { aspect-ratio: 4 / 5; }
.tm_leaderImg img { object-position: 50% 30%; }
.tm_leaderText { grid-column: 7 / span 6; display: flex; flex-direction: column; align-items: flex-start; }
.tm_quote p { font-size: clamp(2.5rem, 4.7vw, 5.25rem); font-weight: 300; line-height: 1.06; letter-spacing: -.04em; margin: clamp(22px, 3vw, 40px) 0 clamp(28px, 3.4vw, 48px); max-width: 11.5em; }
.tm_w { --w: 1; color: color-mix(in srgb, var(--charcoal) calc(var(--w) * 100%), #c4c9cc); }
.tm_wLast { color: color-mix(in srgb, var(--io) calc(var(--w) * 100%), #c4c9cc); }
.tm_who { display: flex; flex-direction: column; gap: 2px; padding-top: 16px; border-top: 1px solid var(--io); min-width: 260px; }
.tm_who b { font-weight: 500; font-size: 1rem; color: var(--charcoal); }
.tm_who span { font-size: .875rem; color: var(--grey-ink); }
.tm_leaderLead { margin-top: 22px; font-size: var(--fs-body); line-height: 1.65; max-width: 31em; color: var(--charcoal); }
.tm_btn { margin-top: clamp(28px, 3vw, 40px); }

/* ---- T3 org helix ---- */
.tm_org { position: relative; background: var(--deep); color: #fff; overflow: clip; }
.tm_org::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(60% 50% at 66% 18%, rgba(60, 167, 210, .55), transparent 70%); }
.tm_org[data-on="true"] { height: calc(4.4 * var(--sh)); overflow: visible; }
.tm_org[data-on="true"] > .tm_orgStick { position: sticky; top: 0; height: var(--sh); overflow: clip; }
.tm_orgStick { position: relative; }
.tm_orgSvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 1; }
.tm_strands path { fill: none; stroke: #fff; stroke-linecap: round; }
.tm_strands g { transition: opacity .45s; }
.tm_rungs line { stroke: rgba(255, 255, 255, .62); stroke-width: 1.4; }
.tm_rungs circle { fill: #fff; }
.tm_rungs g { transition: opacity .6s var(--ease); }
.tm_heads circle { fill: var(--sky); }
.tm_org[data-hot] .tm_strands g:not(.is-hot), .tm_org[data-hot] .tm_rungs { opacity: .2; }
.tm_strands g.is-hot path { stroke-opacity: 1; stroke-width: 2.6; }
